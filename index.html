<title>Извинение для Елены</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Rubik:wght@400;600&display=swap">
<style>
  /* Layout: one full-screen tap zone, one word at a time in the middle, a sheep on the grass reacting to every word */
  :root {
    --sky: #bfe3ff;
    --sky-deep: #8cc8f5;
    --wool: #ffffff;
    --ink: #1d2a4d;
    --blush: #ff6f91;
    --grass: #59b36b;
    --grass-dark: #3f9452;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky-deep);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sky {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    transition: filter 1.2s ease;
  }
  body.gloomy .sky { filter: saturate(.25) brightness(.8); }
  body.gloomy .grass { filter: saturate(.3) brightness(.85); }
  body.party .sky { filter: hue-rotate(-40deg) saturate(1.3); }

  .stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 28px;
    cursor: pointer;
    outline: none;
    overflow: hidden;
  }
  .stage:focus-visible { box-shadow: inset 0 0 0 4px var(--blush); }
  .stage.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(5px, -2px); }
    30%, 50%, 70% { transform: translate(-9px, 3px) rotate(-1deg); }
    40%, 60% { transform: translate(9px, -3px) rotate(1deg); }
  }
  .flash {
    position: fixed; inset: 0; background: var(--wool); pointer-events: none; z-index: 20;
    animation: flash .5s ease-out forwards;
  }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }

  /* drifting wool clouds */
  .cloud {
    position: absolute; background: var(--wool); border-radius: 50%;
    opacity: .75; pointer-events: none; animation: drift linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 60%; height: 120%; left: 15%; top: -45%; }
  .cloud::after { width: 45%; height: 95%; left: 48%; top: -30%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  .grass {
    position: absolute; left: -5%; right: -5%; bottom: 0; height: 16vh;
    background: var(--grass);
    border-radius: 50% 50% 0 0 / 30% 30% 0 0;
    box-shadow: inset 0 10px 0 var(--grass-dark);
    pointer-events: none; transition: filter 1.2s ease;
  }

  .top {
    position: relative; z-index: 3;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
  }
  .top span { opacity: .7; }
  .count { font-variant-numeric: tabular-nums; }
  .bar { position: absolute; left: 0; right: 0; bottom: -10px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.5); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s cubic-bezier(.2,1.4,.4,1); }

  .center {
    position: relative; z-index: 3;
    display: grid; place-items: center; text-align: center;
    min-width: 0; padding-bottom: 12vh;
  }
  .word {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(34px, 11vw, 88px);
    line-height: 1.1;
    text-wrap: balance; max-width: 13ch; overflow-wrap: anywhere;
    color: var(--ink);
    text-shadow: 0 4px 0 var(--wool);
  }
  .word .wd { display: inline-block; white-space: nowrap; }
  .word .ch { display: inline-block; }

  /* entrance styles */
  .fx-wave .ch { animation: wave .6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes wave { from { transform: translateY(80px) scale(.3); opacity: 0; } }

  .fx-calendar { transform-origin: top center; animation: calendar .7s cubic-bezier(.2,1.3,.4,1) both; perspective: 400px; }
  @keyframes calendar { from { transform: rotateX(-110deg); opacity: 0; } }

  .fx-slot .ch { animation: slot .5s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * 90ms); }
  @keyframes slot { 0% { transform: translateY(-120%); opacity: 0; filter: blur(4px); } 100% { filter: blur(0); } }

  .fx-zoom { animation: zoomin .55s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes zoomin { from { transform: scale(4); opacity: 0; filter: blur(8px); } }

  .fx-stomp { animation: stomp .5s cubic-bezier(.3,1.8,.5,1) both; }
  @keyframes stomp { 0% { transform: translateY(-60vh) scaleY(1.4); } 60% { transform: translateY(0) scale(1.3, .7); } 100% { transform: none; } }

  .fx-drop .ch { animation: drop .7s cubic-bezier(.3,1.7,.5,1) both; animation-delay: calc(var(--i) * 120ms); }
  @keyframes drop { from { transform: translateY(-70vh) rotate(-40deg); } }

  .fx-boom { color: var(--blush); animation: boom .6s cubic-bezier(.2,1.8,.4,1) both; font-size: clamp(50px, 17vw, 130px); }
  @keyframes boom { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: rotate(-4deg); } }
  .fx-boom .ch { animation: jitter .18s steps(2) infinite; animation-delay: calc(var(--i) * -40ms); }

  .fx-type .ch { opacity: 0; animation: type .01s forwards; animation-delay: calc(var(--i) * 70ms); }
  .fx-type::after { content: "|"; animation: blink .7s steps(1) infinite; font-weight: 500; }
  @keyframes type { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }

  .fx-rise { animation: rise .6s ease-out both; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; letter-spacing: .4em; } }

  .fx-nervous .ch { animation: pop .4s cubic-bezier(.2,1.6,.4,1) both, jitter .25s steps(2) infinite .5s; animation-delay: calc(var(--i) * 40ms), calc(var(--i) * -50ms); }
  @keyframes pop { from { transform: scale(0); } }
  @keyframes jitter { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(1px, -2px) rotate(3deg); } 100% { transform: translate(-1px, 1px) rotate(-3deg); } }

  .fx-sad { color: var(--ink); font-size: clamp(90px, 32vw, 220px); animation: sad 1.4s cubic-bezier(.4,0,.2,1) both; }
  @keyframes sad { 0% { transform: translateY(-40px) scale(.4); opacity: 0; } 60% { transform: rotate(-12deg) translateY(10px); opacity: 1; } 100% { transform: rotate(-8deg) translateY(6px); } }

  /* timer */
  .timer { display: grid; gap: 14px; justify-items: center; width: min(100%, 540px); }
  .units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .unit {
    background: var(--wool); border-radius: 18px; padding-block: 12px 10px;
    box-shadow: 0 6px 0 rgba(29, 42, 77, .15); min-width: 0;
    animation: wave .6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--i) * 120ms);
  }
  .unit b {
    display: block; font-family: var(--display); font-weight: 800;
    font-size: clamp(24px, 8vw, 52px); font-variant-numeric: tabular-nums;
  }
  .unit b.bump { animation: bump .35s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bump { from { transform: translateY(-40%) scale(1.25); color: var(--blush); } }
  .unit span { font-size: 12px; letter-spacing: .04em; opacity: .7; }
  .since { font-size: 15px; font-weight: 600; background: var(--ink); color: var(--wool); padding: 6px 14px; border-radius: 999px; animation: rise .6s .6s ease-out both; }
  .total { font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; animation: rise .6s .8s ease-out both; }

  /* final question */
  .ask { display: grid; gap: 22px; justify-items: center; }
  .ask .word { font-size: clamp(32px, 10vw, 72px); }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: 600 18px var(--body); border: 0; cursor: pointer;
    padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 5px 0 rgba(29,42,77,.25);
    transition: transform .15s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(29,42,77,.25); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.yes { background: var(--blush); color: var(--wool); animation: pulse 1.2s ease-in-out infinite; }
  .btn.no { background: var(--wool); color: var(--ink); transition: left .25s cubic-bezier(.2,1.4,.4,1), top .25s cubic-bezier(.2,1.4,.4,1); }
  .btn.no.running { position: fixed; z-index: 15; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .bottom { position: relative; z-index: 3; display: grid; justify-items: center; }
  .hint {
    font-weight: 600; font-size: 15px; color: var(--wool);
    background: var(--ink); padding: 8px 16px; border-radius: 999px;
    animation: nudge 1.6s ease-in-out infinite;
    transition: opacity .3s;
  }
  .hint.gone { opacity: 0; }
  @keyframes nudge { 50% { transform: translateY(-4px); } }

  /* sheep */
  .sheep-wrap {
    position: absolute; z-index: 2; right: max(8%, env(safe-area-inset-right, 0px)); bottom: 7vh;
    width: clamp(90px, 26vw, 150px); pointer-events: none;
    transition: transform .4s ease;
  }
  .sheep-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .sheep-body { animation: breathe 2.4s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes breathe { 50% { transform: scale(1.03, .97); } }
  .eye-lid { transform-origin: center; animation: blinkeye 4s infinite; transform-box: fill-box; }
  @keyframes blinkeye { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
  .tear { opacity: 0; }
  .cheek { opacity: 0; transition: opacity .4s; }
  .sheep-wrap.shock { animation: hop .5s cubic-bezier(.3,1.8,.5,1); }
  .sheep-wrap.sad .head { transform: rotate(14deg) translateY(4px); }
  .sheep-wrap.sad .tear { animation: tear 1.2s ease-in infinite; }
  .sheep-wrap.sad .tear.t2 { animation-delay: .6s; }
  @keyframes tear { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(26px); } }
  .sheep-wrap.happy { animation: hop .6s cubic-bezier(.3,1.8,.5,1) infinite; }
  .sheep-wrap.happy .cheek { opacity: .8; }
  .sheep-wrap.peek { transform: rotate(-6deg); }
  @keyframes hop { 40% { transform: translateY(-34px) rotate(-6deg); } }
  .head { transition: transform .5s ease; transform-origin: 30% 40%; transform-box: fill-box; }

  .bubble {
    position: absolute; right: 70%; bottom: 82%;
    background: var(--wool); color: var(--ink);
    font: 800 clamp(14px, 4vw, 20px) var(--display);
    padding: 8px 12px; border-radius: 16px 16px 4px 16px;
    box-shadow: 0 4px 0 rgba(29,42,77,.15);
    white-space: nowrap;
    transform: scale(0); transform-origin: bottom right;
    transition: transform .3s cubic-bezier(.2,1.8,.4,1);
  }
  .bubble.on { transform: scale(1); }

  /* particles */
  .puff, .rain-sheep, .heart, .drop {
    position: fixed; pointer-events: none; z-index: 12;
  }
  .puff {
    width: 14px; height: 14px; border-radius: 50%; background: var(--wool);
    animation: puff .7s ease-out forwards;
  }
  @keyframes puff { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .ripple {
    position: fixed; z-index: 11; pointer-events: none;
    width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    border: 3px solid var(--wool); animation: ripple .6s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(7); opacity: 0; } }
  .rain-sheep { top: -60px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(120vh) rotate(var(--rot)); } }
  .drop { top: -20px; width: 2px; height: 18px; background: rgba(255,255,255,.7); animation: fall .9s linear forwards; --rot: 0deg; }
  .heart { font-size: 26px; animation: heart 1.6s cubic-bezier(.2,.8,.4,1) forwards; }
  @keyframes heart { 0% { transform: translate(0,0) scale(.2); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
  }
</style>

<div class="sky"></div>
<div class="stage" id="stage" tabindex="0" role="button" aria-label="Нажми, чтобы показать следующее слово">
  <div class="cloud" style="width:180px;height:60px;top:14%;animation-duration:48s;animation-delay:-10s"></div>
  <div class="cloud" style="width:120px;height:42px;top:32%;animation-duration:36s;animation-delay:-25s"></div>
  <div class="cloud" style="width:220px;height:70px;top:58%;animation-duration:60s;animation-delay:-40s"></div>
  <div class="grass"></div>

  <div class="sheep-wrap" id="sheep">
    <div class="bubble" id="bubble">Бе?</div>
    <svg viewBox="0 0 160 130" aria-hidden="true">
      <g class="legs" fill="#1d2a4d">
        <rect x="52" y="92" width="9" height="30" rx="4"/><rect x="70" y="95" width="9" height="28" rx="4"/>
        <rect x="100" y="95" width="9" height="28" rx="4"/><rect x="118" y="92" width="9" height="30" rx="4"/>
      </g>
      <g class="sheep-body" fill="#ffffff" stroke="#1d2a4d" stroke-width="3">
        <circle cx="70" cy="62" r="24"/><circle cx="96" cy="54" r="26"/><circle cx="120" cy="66" r="22"/>
        <circle cx="84" cy="84" r="22"/><circle cx="112" cy="86" r="20"/><circle cx="62" cy="82" r="18"/>
        <circle cx="132" cy="80" r="14"/>
      </g>
      <g fill="#ffffff"><ellipse cx="94" cy="72" rx="44" ry="22"/></g>
      <g class="head">
        <ellipse cx="42" cy="62" rx="10" ry="6" fill="#1d2a4d" transform="rotate(-30 42 62)"/>
        <ellipse cx="40" cy="70" rx="22" ry="26" fill="#1d2a4d"/>
        <circle cx="40" cy="46" r="12" fill="#ffffff" stroke="#1d2a4d" stroke-width="3"/>
        <circle cx="31" cy="66" r="6" fill="#ffffff"/><circle cx="49" cy="66" r="6" fill="#ffffff"/>
        <circle cx="32" cy="67" r="3" fill="#1d2a4d"/><circle cx="48" cy="67" r="3" fill="#1d2a4d"/>
        <rect class="eye-lid" x="24" y="59" width="32" height="14" rx="6" fill="#1d2a4d"/>
        <ellipse class="cheek" cx="26" cy="78" rx="5" ry="3" fill="#ff6f91"/>
        <ellipse class="cheek" cx="54" cy="78" rx="5" ry="3" fill="#ff6f91"/>
        <path d="M34 84 q6 4 12 0" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="tear" cx="30" cy="74" rx="2.5" ry="4" fill="#8cc8f5"/>
        <ellipse class="tear t2" cx="50" cy="74" rx="2.5" ry="4" fill="#8cc8f5"/>
      </g>
    </svg>
  </div>

  <div class="top">
    <span>Для Елены</span>
    <span class="count" id="count">1 / 12</span>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="center" id="center" aria-live="polite"></div>

  <div class="bottom">
    <div class="hint" id="hint">тыкни в экран</div>
  </div>
</div>

<script>
  // Момент преступления: 19 сентября 2026, 14:56 (по местному времени зрителя)
  const INCIDENT = new Date(2026, 8, 19, 14, 56, 0);

  // fx: стиль появления; mood: реакция овечки; say: что она говорит
  const STEPS = [
    { text: "Привет, Елена!", fx: "wave", say: "Бе-бе!", mood: "peek" },
    { text: "19 сентября", fx: "calendar" },
    { text: "в 14:56", fx: "slot" },
    { text: "я публично", fx: "zoom" },
    { text: "назвал", fx: "stomp", mood: "shock", say: "Кого?" },
    { text: "вас", fx: "drop" },
    { text: "овцой", fx: "boom", mood: "shock", say: "ЭЙ!", shake: true },
    { text: "мне потребовалось", fx: "type" },
    { timer: true, say: "Долго!" },
    { text: "чтобы", fx: "rise" },
    { text: "извиниться", fx: "nervous", say: "Ну-ну…" },
    { text: "=(", fx: "sad", mood: "sad", gloom: true },
    { ask: true, mood: "sad" }
  ];
  const WORDS = STEPS.length - 1; // экран с вопросом не считаем

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), center = $("center"), hint = $("hint");
  const sheep = $("sheep"), bubble = $("bubble");
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  let i = 0, timerId = null, rainId = null, forgiven = false, bubbleT = null;

  const haptic = (kind) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  function splitChars(text) {
    // буквы внутри слова держим вместе, чтобы перенос был только между словами
    let k = 0;
    return text.split(" ").map((w) =>
      `<span class="wd">${[...w].map((c) => `<span class="ch" style="--i:${k++}">${c}</span>`).join("")}</span>`
    ).join(" ");
  }

  function say(text) {
    clearTimeout(bubbleT);
    bubble.textContent = text;
    bubble.classList.add("on");
    bubbleT = setTimeout(() => bubble.classList.remove("on"), 1800);
  }

  function setMood(mood) {
    sheep.className = "sheep-wrap";
    void sheep.offsetWidth;
    if (mood) sheep.classList.add(mood);
  }

  function renderTimer() {
    const units = [["d", "дней"], ["h", "часов"], ["m", "минут"], ["s", "секунд"]];
    center.innerHTML = `
      <div class="timer">
        <div class="units">${units.map(([id, l], k) =>
          `<div class="unit" style="--i:${k}"><b id="${id}">0</b><span id="${id}l">${l}</span></div>`).join("")}
        </div>
        <div class="since">и счётчик всё ещё тикает</div>
        <div class="total" id="total"></div>
      </div>`;
    const last = {};
    const forms = {
      d: ["день", "дня", "дней"], h: ["час", "часа", "часов"],
      m: ["минута", "минуты", "минут"], s: ["секунда", "секунды", "секунд"]
    };
    const tick = () => {
      const all = Math.max(0, Math.floor((Date.now() - INCIDENT) / 1000));
      let t = all;
      const v = { d: Math.floor(t / 86400) };
      t %= 86400; v.h = Math.floor(t / 3600); t %= 3600; v.m = Math.floor(t / 60); v.s = t % 60;
      for (const id in v) {
        if (last[id] === v[id]) continue;
        const el = $(id);
        el.textContent = v[id];
        $(id + "l").textContent = plural(v[id], ...forms[id]);
        if (last[id] !== undefined) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
        last[id] = v[id];
      }
      $("total").textContent = `это ${all.toLocaleString("ru-RU")} ${plural(all, "секунда", "секунды", "секунд")} раскаяния`;
    };
    tick();
    timerId = setInterval(tick, 1000);
  }

  function renderAsk() {
    center.innerHTML = `
      <div class="ask">
        <div class="word fx-wave">${splitChars("Простите?")}</div>
        <div class="btns">
          <button class="btn yes" id="yes" type="button">Прощаю</button>
          <button class="btn no" id="no" type="button">Нет</button>
        </div>
      </div>`;
    const no = $("no");
    let dodges = 0;
    const NO_LINES = ["Нет", "Точно нет?", "Подумайте ещё", "Ну пожалуйста", "Последний шанс", "Ладно, прощаю"];
    const run = (e) => {
      e.stopPropagation();
      if (dodges >= NO_LINES.length - 1) return;
      e.preventDefault();
      dodges++;
      haptic("light");
      no.textContent = NO_LINES[dodges];
      const r = no.getBoundingClientRect();
      if (!no.classList.contains("running")) {
        no.style.left = r.left + "px"; no.style.top = r.top + "px";
        no.classList.add("running");
        void no.offsetWidth;
      }
      const pad = 16;
      const x = pad + Math.random() * (innerWidth - r.width - pad * 2);
      const y = 80 + Math.random() * (innerHeight * 0.6 - r.height);
      no.style.left = x + "px"; no.style.top = y + "px";
      say(["Ай!", "Не-а", "Мимо!", "Хи-хи", "Бе-е"][dodges % 5]);
    };
    no.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") run(e); });
    no.addEventListener("pointerdown", run);
    no.addEventListener("click", (e) => {
      e.stopPropagation();
      if (dodges >= NO_LINES.length - 1) forgive();
    });
    $("yes").addEventListener("click", (e) => { e.stopPropagation(); forgive(); });
  }

  function forgive() {
    if (forgiven) return;
    forgiven = true;
    haptic("heavy");
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    clearInterval(rainId);
    document.body.classList.remove("gloomy");
    document.body.classList.add("party");
    document.querySelectorAll(".btn.no.running").forEach((b) => b.remove());
    setMood("happy");
    say("Ура-а-а!");
    center.innerHTML = `
      <div class="ask">
        <div class="word fx-wave">${splitChars("Спасибо!")}</div>
        <div class="word fx-rise" style="font-size:clamp(18px,5vw,30px);font-weight:500;animation-delay:.5s">Больше не буду. Честно-честно</div>
      </div>`;
    hint.textContent = "тыкни, чтобы посмотреть ещё раз";
    hint.classList.remove("gone");
    hearts(innerWidth / 2, innerHeight / 2, 40);
  }

  function hearts(x, y, n) {
    const set = ["💗", "💖", "🤍", "🐑", "✨"];
    for (let k = 0; k < n; k++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = set[k % set.length];
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 260;
      h.style.left = x + "px"; h.style.top = y + "px";
      h.style.setProperty("--dx", Math.cos(a) * d + "px");
      h.style.setProperty("--dy", Math.sin(a) * d - 80 + "px");
      h.style.setProperty("--rot", (Math.random() * 120 - 60) + "deg");
      h.style.animationDelay = Math.random() * .3 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2200);
    }
  }

  function burst(x, y, big) {
    const r = document.createElement("div");
    r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
    const n = big ? 22 : 8;
    for (let k = 0; k < n; k++) {
      const p = document.createElement("div");
      p.className = "puff";
      const a = (k / n) * Math.PI * 2 + Math.random() * .5, d = (big ? 90 : 40) + Math.random() * (big ? 120 : 40);
      p.style.left = x - 7 + "px"; p.style.top = y - 7 + "px";
      p.style.setProperty("--dx", Math.cos(a) * d + "px");
      p.style.setProperty("--dy", Math.sin(a) * d + "px");
      if (big) p.style.width = p.style.height = 10 + Math.random() * 18 + "px";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
  }

  function sheepRain() {
    for (let k = 0; k < 18; k++) {
      const s = document.createElement("div");
      s.className = "rain-sheep";
      s.textContent = "🐑";
      s.style.left = Math.random() * 92 + "vw";
      s.style.fontSize = 26 + Math.random() * 30 + "px";
      s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      s.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
      s.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 6000);
    }
    clearInterval(rainId);
    rainId = setInterval(() => {
      for (let k = 0; k < 4; k++) {
        const d = document.createElement("div");
        d.className = "drop";
        d.style.left = Math.random() * 100 + "vw";
        d.style.animationDuration = .6 + Math.random() * .5 + "s";
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 1300);
      }
    }, 120);
  }

  function show(idx) {
    clearInterval(timerId);
    const step = STEPS[idx];
    document.body.classList.toggle("gloomy", !!(step.gloom || step.ask));
    if (!step.gloom && !step.ask) clearInterval(rainId);

    if (step.timer) renderTimer();
    else if (step.ask) renderAsk();
    else {
      const w = document.createElement("div");
      w.className = "word fx-" + step.fx;
      w.innerHTML = splitChars(step.text);
      center.replaceChildren(w);
    }

    setMood(step.mood);
    if (step.say) say(step.say);
    if (step.shake) {
      stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
      const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f);
      setTimeout(() => f.remove(), 600);
      burst(innerWidth / 2, innerHeight * .45, true);
    }
    if (step.gloom) sheepRain();

    const shown = Math.min(idx + 1, WORDS);
    $("count").textContent = `${shown} / ${WORDS}`;
    $("bar").style.width = (shown / WORDS * 100) + "%";
    hint.classList.toggle("gone", !!step.ask);
    hint.textContent = idx === 0 ? "тыкни в экран" : step.gloom ? "тыкни ещё разок" : "дальше";
  }

  function restart() {
    forgiven = false;
    document.body.classList.remove("party");
    i = 0;
    show(0);
  }

  function next(x, y) {
    if (STEPS[i].ask && !forgiven) return; // тут надо ответить кнопкой
    if (forgiven) { restart(); return; }
    i = Math.min(i + 1, STEPS.length - 1);
    if (x !== undefined) burst(x, y, false);
    show(i);
    haptic(STEPS[i].shake || STEPS[i].gloom ? "heavy" : "light");
  }

  stage.addEventListener("click", (e) => next(e.clientX, e.clientY));
  stage.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); next(); }
  });

  show(0);
</script>
